<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaHooWest – Quiz Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
      color: #3c1e0f;
      overflow: hidden;
    }

    /* ── Shared container ─────────────────────────────── */
    #app {
      position: relative;
      width: 1366px;
      height: 768px;
      overflow: hidden;
      background: #000;
    }

    .screen {
      display: none;
      position: absolute;
      inset: 0;
    }
    .screen.active { display: flex; }

    /* Background images fill the screen container */
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Home Screen ──────────────────────────────────── */
    #home-screen {
      justify-content: center;
      align-items: center;
    }
    #signin-btn {
      position: absolute;
      left: 390px; top: 390px;
      width: 585px; height: 125px;
      background: transparent;
      border: none;
      cursor: pointer;
      font: bold 72px 'Comic Sans MS', cursive;
      color: rgb(131, 94, 87);
      z-index: 2;
    }
    #signin-btn:hover { opacity: 0.85; }
    #auth-code-banner {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      color: #2a2121;
      padding: 20px 40px;
      border-radius: 12px;
      font-size: 28px;
      z-index: 10;
      text-align: center;
    }

    /* ── Main / Subject Screen ────────────────────────── */
    #main-screen {
      justify-content: center;
      align-items: center;
    }
    .subject-btn {
      position: absolute;
      width: 480px;
      height: 125px;
      background: transparent;
      border: none;
      cursor: pointer;
      font: 32px 'Comic Sans MS', cursive;
      color: rgb(51, 8, 0);
      z-index: 2;
    }
    .subject-btn:hover { opacity: 0.8; }
    #btn-sat  { left: 440px; top: 340px; }
    #btn-lsat { left: 440px; top: 490px; }
    #btn-mcat { left: 440px; top: 625px; }

    /* ── Character Selection ──────────────────────────── */
    #char-screen {
      justify-content: center;
      align-items: center;
    }
    #char-grid {
      position: absolute;
      top: 200px; left: 50px;
      display: grid;
      grid-template-columns: repeat(4, 200px);
      grid-template-rows: repeat(2, 240px);
      gap: 40px 40px;
      z-index: 2;
    }
    .char-cell {
      width: 200px; height: 240px;
      background: transparent;
      border: 3px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      text-shadow: 1px 1px 3px #000;
      padding-bottom: 8px;
    }
    .char-cell:hover { border-color: #fff; }

    /* ── Waiting Screen ───────────────────────────────── */
    #waiting-screen {
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #waiting-screen .bg {
      object-fit: none;
      object-position: center;
    }
    #wait-status {
      position: absolute;
      bottom: 80px; left: 50px;
      font-size: 24px;
      color: #666;
      line-height: 1.8;
      z-index: 2;
    }

    /* ── Game Screen ──────────────────────────────────── */
    #game-screen {
      justify-content: center;
      align-items: center;
    }

    /* Top area: image left + question text right */
    #game-top {
      position: absolute;
      left: 60px; top: 200px;
      right: 60px;
      z-index: 2;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 20px;
    }
    #game-img {
      flex-shrink: 0;
      max-width: 400px;
      max-height: 340px;
      display: flex;
      align-items: flex-start;
    }
    #game-img img {
      max-width: 100%;
      max-height: 340px;
      object-fit: contain;
      border-radius: 8px;
    }
    #game-text {
      flex: 1;
      min-width: 0;
    }
    #q-number {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    #q-passage {
      font-size: 18px;
      color: rgb(80,50,30);
      margin-bottom: 8px;
      max-height: 120px;
      overflow-y: auto;
    }
    #q-text {
      font-size: 22px;
      color: rgb(30,15,5);
      margin-bottom: 6px;
      max-height: 220px;
      overflow-y: auto;
    }

    /* Choice buttons – two columns at bottom */
    #choices-left, #choices-right {
      position: absolute;
      bottom: 80px;
      width: 540px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 60px;
    }
    #choices-left  { left: 90px; bottom: 60px; }
    #choices-right { right: 90px; bottom: 60px}

    .choice-btn {
      width: 100%;
      min-height: 70px;
      padding: 14px 18px;
      background: rgba(255,255,255,0.22);
      border: 2px solid rgb(80,40,20);
      border-radius: 10px;
      cursor: pointer;
      font: 22px 'Comic Sans MS', cursive;
      color: rgb(40,20,5);
      text-align: left;
    }
    .choice-btn:hover {
      background: rgba(255,255,255,0.50);
    }

    #done-banner {
      display: none;
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      font-size: 32px;
      text-align: center;
    }
    #done-banner .sub {
      font-size: 20px;
      color: rgb(100,60,30);
      margin-top: 8px;
    }

    /* ── End Screen ───────────────────────────────────── */
    #end-screen {
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 0 30px;
      overflow-y: auto;
      gap: 10px;
    }
    #end-text {
      font-size: 42px;
      color: #fff;
      text-align: center;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
      z-index: 2;
      padding: 20px 40px;
      border-radius: 12px;
      background: rgba(0,0,0,0.5);
    }
    #play-again-btn {
      margin-top: 10px;
      margin-bottom: 20px;
      padding: 16px 48px;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      background: rgba(0,0,0,0.6);
      border: 3px solid #fff;
      border-radius: 10px;
      cursor: pointer;
      z-index: 2;
      transition: background 0.2s;
    }
    #play-again-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    #review-title {
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      text-align: center;
      z-index: 2;
    }
    #review-section {
      z-index: 2;
      width: 85%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
    }
    .review-card {
      background: rgba(0,0,0,0.65);
      border-radius: 10px;
      padding: 14px 18px;
      color: #fff;
      border-left: 6px solid;
    }
    .review-card.correct {
      border-left-color: #4caf50;
    }
    .review-card.wrong {
      border-left-color: #f44336;
    }
    .review-q {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .review-answer {
      font-size: 15px;
      margin-top: 4px;
      line-height: 1.3;
    }
    .review-answer.your-correct {
      color: #a5d6a7;
    }
    .review-answer.your-wrong {
      color: #ef9a9a;
    }
    .review-answer.correct-ans {
      color: #a5d6a7;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- ═══ HOME ═══ -->
  <div id="home-screen" class="screen active">
    <img class="bg" src="images/homePage.png" alt="">
    <button id="signin-btn">SIGN IN</button>
    <div id="auth-code-banner"></div>
  </div>

  <!-- ═══ SUBJECT SELECT ═══ -->
  <div id="main-screen" class="screen">
    <img class="bg" src="images/mainScreen.png" alt="">
    <button id="btn-sat" class="subject-btn">SAT</button>
    <button id="btn-lsat" class="subject-btn">LSAT</button>
    <button id="btn-mcat" class="subject-btn">MCAT</button>
  </div>

  <!-- ═══ CHARACTER SELECT ═══ -->
  <div id="char-screen" class="screen">
    <img class="bg" src="images/charSelection.png" alt="">
    <div id="char-grid"></div>
  </div>

  <!-- ═══ WAITING ═══ -->
  <div id="waiting-screen" class="screen">
    <img class="bg" src="images/loadingscreen.png" alt="">
    <div id="wait-status"></div>
  </div>

  <!-- ═══ GAME ═══ -->
  <div id="game-screen" class="screen">
    <img class="bg" src="images/gamescreen.png" alt="">

    <!-- Top: image left + question text right -->
    <div id="game-top">
      <div id="game-img"></div>
      <div id="game-text">
        <div id="q-number"></div>
        <div id="q-passage"></div>
        <div id="q-text"></div>
      </div>
    </div>

    <!-- Bottom-left: choices A & B -->
    <div id="choices-left"></div>

    <!-- Bottom-right: choices C & D -->
    <div id="choices-right"></div>

    <!-- Done overlay -->
    <div id="done-banner">
      <div id="done-score"></div>
      <div class="sub">Waiting for opponent to finish...</div>
    </div>
  </div>

  <!-- ═══ END ═══ -->
  <div id="end-screen" class="screen">
    <img id="end-bg" class="bg" src="" alt="">
    <div id="end-text"></div>
    <div id="review-title">📋 Review</div>
    <div id="review-section"></div>
    <button id="play-again-btn">PLAY AGAIN</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   All game logic – protocols, auth, websocket client, UI
   ═══════════════════════════════════════════════════════════ */

// ── Protocols ───────────────────────────────────────────
const Protocols = {
  Response: {
    NICKNAME:             "protocols.response.nickname",
    QUESTIONS:            "protocols.questions",
    QUESTION_DETAIL:      "protocols.question.detail",
    START:                "protocols.start",
    OPPONENT:             "protocols.opponent",
    OPPONENT_ADVANCE:     "protocols.opponent.advance",
    ANSWER_VALID:         "protocols.answer.valid",
    ANSWER_INVALID:       "protocols.answer.invalid",
    WINNER:               "protocols.winner",
    TIE:                  "protocols.tie",
    GAME_OVER:            "protocols.game.over",
    OPPONENT_DISCONNECTED:"protocols.opponent.disconnected",
  },
  Request: {
    ANSWER:   "protocols.answer",
    NICKNAME: "protocols.nickname",
    TABLE:    "protocols.table",
    LEAVE:    "protocols.leave",
  },
};

// ── Config ──────────────────────────────────────────────
const AUTH0_DOMAIN    = "dev-rme822qrk8tmjtko.us.auth0.com";
const AUTH0_CLIENT_ID = "iHrUT1YqwO0o86sRUc7u9sNGyPBssFnq";
const AUTH0_AUDIENCE  = "https://dev-rme822qrk8tmjtko.us.auth0.com/api/v2/";
const SERVER_HOST     = "localhost";
const SERVER_PORT     = 64210;

// ── Auth Manager ────────────────────────────────────────
const auth = {
  deviceCode: null,
  userCode: null,
  verificationUri: null,
  accessToken: null,

  async startLogin() {
    console.log("[AUTH] Starting login...");
    try {
      const resp = await fetch(`https://${AUTH0_DOMAIN}/oauth/device/code`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          client_id: AUTH0_CLIENT_ID,
          scope: "openid profile email",
          audience: AUTH0_AUDIENCE,
        }),
      });
      const data = await resp.json();
      console.log("[AUTH] Device code response:", data);
      this.deviceCode = data.device_code;
      this.userCode = data.user_code;
      this.verificationUri = data.verification_uri_complete;
      if (this.verificationUri) window.open(this.verificationUri, "_blank");
      return this.userCode;
    } catch (e) {
      console.error("[AUTH] startLogin failed:", e);
      return null;
    }
  },

  async checkToken() {
    const resp = await fetch(`https://${AUTH0_DOMAIN}/oauth/token`, {
      method: "POST",
      body: new URLSearchParams({
        grant_type: "urn:ietf:params:oauth:grant-type:device_code",
        device_code: this.deviceCode || "",
        client_id: AUTH0_CLIENT_ID,
      }),
    });
    const data = await resp.json();
    if (resp.status === 200) {
      this.accessToken = data.access_token;
      return true;
    }
    return false;
  },

  async fetchUserinfo() {
    if (!this.accessToken) return null;
    try {
      const resp = await fetch(`https://${AUTH0_DOMAIN}/userinfo`, {
        headers: { Authorization: `Bearer ${this.accessToken}` },
      });
      if (resp.ok) return await resp.json();
    } catch (e) { console.log("fetchUserinfo failed", e); }
    return null;
  },
};

// ── WebSocket Client ────────────────────────────────────
const client = {
  ws: null,
  nickname: null,
  closed: false,
  started: false,
  questions: [],
  currentQuestionIndex: 0,
  opponentQuestionIndex: 0,
  opponentName: null,
  winner: null,
  youWon: false,
  tie: false,
  gameOver: false,
  correctCount: 0,
  currentQuestionText: null,
  currentChoices: null,
  currentImageData: null,
  currentPassage: null,
  currentAnswer: null,
  reviewHistory: [],

  start() {
    return new Promise((resolve, reject) => {
      const url = `ws://${SERVER_HOST}:${SERVER_PORT}`;
      try { this.ws = new WebSocket(url); } catch (e) { return reject(e); }

      this.ws.onopen = () => { console.log("[WS] Connected"); resolve(); };
      this.ws.onerror = (e) => { console.log("[WS] Error", e); reject(new Error("WS failed")); };
      this.ws.onclose = () => { console.log("[WS] Closed"); this.closed = true; };

      this.ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        this._handle(msg);
      };
    });
  },

  send(type, data) {
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
    this.ws.send(JSON.stringify({ type, data }));
  },

  close() {
    this.closed = true;
    try { this.ws && this.ws.close(); } catch {}
  },

  _handle(msg) {
    const { type, data } = msg;
    console.log("[CLIENT]", type);

    switch (type) {
      case Protocols.Response.QUESTIONS:
        this.questions = data;
        break;

      case Protocols.Response.QUESTION_DETAIL:
        if (!data) break;
        this.currentQuestionText = data.question;
        this.currentChoices      = data.choices;
        this.currentPassage      = data.passage;
        this.currentAnswer       = data.answer;
        this.currentImageData    = data.image_data || null;
        ui.renderGame();
        break;

      case Protocols.Response.OPPONENT:
        this.opponentName = data;
        ui.refreshWaiting();
        break;

      case Protocols.Response.OPPONENT_ADVANCE:
        this.opponentQuestionIndex++;
        break;

      case Protocols.Response.ANSWER_VALID:
        if (data) {
          client.reviewHistory.push({ ...data, correct: true });
        }
        this.currentQuestionIndex++;
        this.correctCount++;
        break;

      case Protocols.Response.ANSWER_INVALID:
        if (data) {
          client.reviewHistory.push({ ...data, correct: false });
        }
        this.currentQuestionIndex++;
        break;

      case Protocols.Response.GAME_OVER:
        this.gameOver = true;
        ui.renderGame();
        break;

      case Protocols.Response.START:
        this.started = true;
        ui.showScreen("game-screen");
        ui.renderGame();
        break;

      case Protocols.Response.TIE:
        this.tie = true;
        ui.showEnd();
        break;

      case Protocols.Response.WINNER:
        if (data === null) this.youWon = true;
        else this.winner = data;
        ui.showEnd();
        break;

      case Protocols.Response.OPPONENT_DISCONNECTED:
        this.close();
        ui.showEnd();
        break;
    }
  },
};

// ── UI Controller ───────────────────────────────────────
const ui = {
  showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  },

  /* ── Home / Auth ─────────────────────── */
  initHome() {
    document.getElementById("signin-btn").onclick = async () => {
      await this._connectAsGuest();
    };
  },

  async _connectAsGuest() {
    document.getElementById("auth-code-banner").style.display = "none";
    try { await client.start(); } catch (e) {
      console.error("Server connection failed", e);
      alert("Could not connect to game server on port 64210. Is it running?");
      return;
    }
    const nick = prompt("Enter your nickname:", "Player") || "Player";
    client.send(Protocols.Request.NICKNAME, nick);
    client.nickname = nick;
    ui.showScreen("main-screen");
  },

  _authInterval: null,
  _pollAuth() {
    this._authInterval = setInterval(async () => {
      const ok = await auth.checkToken();
      if (!ok) return;
      clearInterval(this._authInterval);
      document.getElementById("auth-code-banner").style.display = "none";

      try { await client.start(); } catch (e) {
        console.error("Server connection failed", e);
        return;
      }

      const profile = await auth.fetchUserinfo();
      let nick = "Player";
      if (profile) nick = profile.nickname || profile.name || profile.preferred_username || "Player";
      client.send(Protocols.Request.NICKNAME, nick);
      client.nickname = nick;

      ui.showScreen("main-screen");
    }, 5000);
  },

  /* ── Subject Selection ───────────────── */
  initSubjects() {
    const subjects = {
      "btn-sat":  "QUESTION_ANSWERS_SATMATH",
      "btn-lsat": "QUESTION_ANSWERS_LSAT",
      "btn-mcat": "QUESTION_ANSWERS_MCAT",
    };
    for (const [btnId, table] of Object.entries(subjects)) {
      document.getElementById(btnId).onclick = () => {
        client.send(Protocols.Request.TABLE, table);
        ui.showScreen("char-screen");
      };
    }
  },

  /* ── Character Selection ─────────────── */
  initCharacters() {
    const characterMap = [
    { name: "Barbara", species: "redPanda" },
    { name: "Dennis", species: "dino" },
    { name: "Cassandra", species: "capy" },
    { name: "Charlie", species: "chick" },
    { name: "Pancho", species: "penguin" },
    { name: "Alex", species: "bunny" },
    { name: "Cloudy", species: "cat" },
    { name: "Eduardo", species: "elephant" },
  ];

  const grid = document.getElementById("char-grid");
  
  characterMap.forEach(char => {
    const cell = document.createElement("div");
    cell.className = "char-cell";
    
    // Path uses the 'species' (folder name)
    const img = document.createElement("img");
    img.src = `images/animals/${char.species}/${char.species}_forward.png`;
    
    // Label uses the 'name'
    const label = document.createElement("span");
    label.textContent = char.name;

    cell.appendChild(img);
    cell.appendChild(label);
    
    cell.onclick = () => {
      // Store both
      client.selectedName = char.name;
      client.selectedSpecies = char.species;
      
      ui.showScreen("waiting-screen");
      ui.refreshWaiting();
    };
    grid.appendChild(cell);
  });
},

  /* ── Waiting ─────────────────────────── */
  refreshWaiting() {
    const el = document.getElementById("wait-status");
    if (!el) return;
    el.innerHTML = [
      `Logged in: true`,
      `Questions loaded: ${client.questions.length > 0}`,
      `Opponent: ${client.opponentName || "searching..."}`,
    ].join("<br>");
  },

  /* ── Game Screen ─────────────────────── */
  renderGame() {
    const totalQs = Math.min(client.questions.length || 3, 3);
    const qNum = client.currentQuestionIndex + 1;

    document.getElementById("q-number").textContent =
      `Question ${qNum} of ${totalQs}`;

    document.getElementById("q-passage").textContent =
      client.currentPassage || "";

    document.getElementById("q-text").textContent =
      client.currentQuestionText || "";

    const leftCol   = document.getElementById("choices-left");
    const rightCol  = document.getElementById("choices-right");
    const doneBanner = document.getElementById("done-banner");

    if (client.gameOver) {
      leftCol.style.display = "none";
      rightCol.style.display = "none";
      doneBanner.style.display = "block";
      document.getElementById("done-score").textContent =
        `All done! Score: ${client.correctCount}/${totalQs}`;
    } else {
      doneBanner.style.display = "none";
      leftCol.style.display = "flex";
      rightCol.style.display = "flex";
      leftCol.innerHTML = "";
      rightCol.innerHTML = "";

      const choices = client.currentChoices || {};
      ["A","B"].forEach(letter => {
        const text = choices[letter];
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = text ? `${letter}:  ${text}` : `${letter}:  ---`;
        btn.onclick = () => {
          if (client.gameOver) return;
          client.send(Protocols.Request.ANSWER, letter);
        };
        leftCol.appendChild(btn);
      });
      ["C","D"].forEach(letter => {
        const text = choices[letter];
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = text ? `${letter}:  ${text}` : `${letter}:  ---`;
        btn.onclick = () => {
          if (client.gameOver) return;
          client.send(Protocols.Request.ANSWER, letter);
        };
        rightCol.appendChild(btn);
      });
    }

    const imgPanel = document.getElementById("game-img");
    imgPanel.innerHTML = "";
    if (client.currentImageData) {
      const img = document.createElement("img");
      img.src = `data:image/png;base64,${client.currentImageData}`;
      imgPanel.appendChild(img);
    }
  },

  /* ── End Screen ──────────────────────── */
  showEnd() {
    let text;
    let bgImage;
    if (client.tie) {
      text = `It's a tie! You both scored ${client.correctCount}/3`;
      bgImage = "images/winScreen.png";
    } else if (client.youWon) {
      text = `You won! Score: ${client.correctCount}/3`;
      bgImage = "images/winScreen.png";
    } else if (client.winner) {
      text = `${client.winner} won! Your score: ${client.correctCount}/3`;
      bgImage = "images/lostScreen.png";
    } else {
      text = "Opponent left the game.....";
      bgImage = "images/lostScreen.png";
    }
    document.getElementById("end-bg").src = bgImage;
    document.getElementById("end-text").textContent = text;

    // Helper: display an answer as "Letter) text"
    const answerDisplay = (answer, choices) => {
      if (!choices) return answer;
      const upper = String(answer).trim().toUpperCase();
      // If answer is already a choice letter
      if (["A","B","C","D"].includes(upper)) {
        const choiceText = choices[upper];
        return choiceText ? `${upper}) ${choiceText}` : upper;
      }
      // Answer is a raw value — find which choice matches
      for (const [letter, val] of Object.entries(choices)) {
        if (val && String(val).trim().toUpperCase() === upper) {
          return `${letter}) ${val}`;
        }
      }
      return answer;
    };

    // Build review cards
    const reviewEl = document.getElementById("review-section");
    reviewEl.innerHTML = "";
    client.reviewHistory.forEach((item, i) => {
      const card = document.createElement("div");
      card.className = `review-card ${item.correct ? "correct" : "wrong"}`;

      const qDiv = document.createElement("div");
      qDiv.className = "review-q";
      qDiv.textContent = `Q${i + 1}: ${item.question || "(No question text)"}`;
      card.appendChild(qDiv);

      const yourDiv = document.createElement("div");
      yourDiv.className = `review-answer ${item.correct ? "your-correct" : "your-wrong"}`;
      yourDiv.textContent = `Your answer: ${answerDisplay(item.yourAnswer, item.choices)} ${item.correct ? "✅" : "❌"}`;
      card.appendChild(yourDiv);

      if (!item.correct) {
        const correctDiv = document.createElement("div");
        correctDiv.className = "review-answer correct-ans";
        correctDiv.textContent = `Correct answer: ${answerDisplay(item.correctAnswer, item.choices)}`;
        card.appendChild(correctDiv);
      }

      reviewEl.appendChild(card);
    });

    document.getElementById("play-again-btn").onclick = () => {
      ui.showScreen("main-screen");
    };
    this.showScreen("end-screen");
  },
};

// ── Boot ────────────────────────────────────────────────
ui.initHome();
ui.initSubjects();
ui.initCharacters();
</script>
</body>
</html>
