<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaHooWest – Quiz Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
      color: #3c1e0f;
      overflow: hidden;
    }

    /* ── Shared container ─────────────────────────────── */
    #app {
      position: relative;
      width: 1366px;
      height: 768px;
      overflow: hidden;
      background: #000;
    }

    .screen {
      display: none;
      position: absolute;
      inset: 0;
    }
    .screen.active { display: flex; }

    /* Background images fill the screen container */
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Home Screen ──────────────────────────────────── */
    #home-screen {
      justify-content: center;
      align-items: center;
    }
    #signin-btn {
      position: absolute;
      left: 390px; top: 390px;
      width: 585px; height: 125px;
      background: transparent;
      border: none;
      cursor: pointer;
      font: bold 72px 'Comic Sans MS', cursive;
      color: rgb(131, 94, 87);
      z-index: 2;
    }
    #signin-btn:hover { opacity: 0.85; }
    #auth-code-banner {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 30px 48px;
      border-radius: 16px;
      border: 2px solid #ffd54f;
      font-size: 28px;
      z-index: 10;
      text-align: center;
      min-width: 500px;
      max-width: 80%;
    }

    /* ── Main / Subject Screen ────────────────────────── */
    #main-screen {
      justify-content: center;
      align-items: center;
    }
    .subject-btn {
      position: absolute;
      width: 480px;
      height: 125px;
      background: transparent;
      border: none;
      cursor: pointer;
      font: 32px 'Comic Sans MS', cursive;
      color: rgb(51, 8, 0);
      z-index: 2;
    }
    .subject-btn:hover { opacity: 0.8; }
    #btn-sat  { left: 440px; top: 340px; }
    #btn-lsat { left: 440px; top: 490px; }
    #btn-mcat { left: 440px; top: 625px; }

    /* ── Character Selection ──────────────────────────── */
    #char-screen {
      justify-content: center;
      align-items: center;
    }
    #char-grid {
      position: absolute;
      top: 200px; left: 80px;
      display: grid;
      grid-template-columns: repeat(4, 200px);
      grid-template-rows: repeat(2, 240px);
      gap: 40px 120px;
      z-index: 2;
    }
    .char-cell {
      width: 200px; height: 240px;
      background: transparent;
      border: 3px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      text-shadow: 1px 1px 3px #000;
      padding-bottom: 8px;
    }
    .char-cell:hover { border-color: #fff; }

    /* ── Waiting Screen ───────────────────────────────── */
    #waiting-screen {
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #waiting-screen .bg {
      object-fit: none;
      object-position: center;
    }
    #wait-status {
      position: absolute;
      bottom: 80px; left: 50px;
      font-size: 24px;
      color: #666;
      line-height: 1.8;
      z-index: 2;
    }

    /* ── Game Screen ──────────────────────────────────── */
    #game-screen {
      justify-content: center;
      align-items: center;
    }

    /* ── Progress Bar ─────────────────────────────────── */
    #progress-bar {
      position: absolute;
      top: 10px;
      left: 40px;
      right: 40px;
      height: 120px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #progress-track {
      position: relative;
      width: 100%;
      height: 18px;
      background: rgba(0,0,0,0.3);
      border-radius: 9px;
      border: 2px solid rgba(255,255,255,0.4);
    }
    #progress-fill-left {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #81c784);
      border-radius: 9px 0 0 9px;
      transition: width 0.5s ease;
    }
    #progress-fill-right {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 0%;
      background: linear-gradient(270deg, #f44336, #e57373);
      border-radius: 0 9px 9px 0;
      transition: width 0.5s ease;
    }
    .progress-char {
      position: absolute;
      width: 80px;
      height: 80px;
      top: 20px;
      transition: left 0.5s ease, right 0.5s ease;
      z-index: 4;
      image-rendering: pixelated;
    }
    .progress-char img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #char-left { left: -40px; }
    #char-right { right: -40px; left: auto; }
    #star-center {
      position: absolute;
      left: calc(50% - 24px);
      top: -15px;
      width: 48px;
      height: 48px;
      z-index: 5;
    }
    #star-center img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .progress-name {
      position: absolute;
      bottom: -52px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 3px #000;
      white-space: nowrap;
    }
    #name-left { left: 0px; }
    #name-right { right: 0px; }

    #end-screen #progress-bar {
      position: relative;
      top: auto;
      left: auto;
      right: auto;
      width: 80%;
      max-width: 1000px;
      margin: 10px 0;
    }

    @keyframes throwStarRight {
      0%   { left: calc(50% - 24px); transform: scale(1) rotate(0deg); }
      30%  { transform: scale(1.4) rotate(180deg); top: -40px; }
      70%  { transform: scale(1.2) rotate(540deg); top: -10px; }
      100% { left: calc(100% - 60px); transform: scale(1) rotate(720deg); top: 30px; }
    }
    @keyframes throwStarLeft {
      0%   { left: calc(50% - 24px); transform: scale(1) rotate(0deg); }
      30%  { transform: scale(1.4) rotate(-180deg); top: -40px; }
      70%  { transform: scale(1.2) rotate(-540deg); top: -10px; }
      100% { left: -20px; transform: scale(1) rotate(-720deg); top: 30px; }
    }
    .star-throw-right {
      animation: throwStarRight 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    .star-throw-left {
      animation: throwStarLeft 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    /* Top area: image left + question text right */
    #game-top {
      position: absolute;
      left: 60px; top: 200px;
      right: 60px;
      z-index: 2;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 20px;
    }
    #game-img {
      flex-shrink: 0;
      max-width: 400px;
      max-height: 340px;
      display: flex;
      align-items: flex-start;
    }
    #game-img img {
      max-width: 100%;
      max-height: 340px;
      object-fit: contain;
      border-radius: 8px;
    }
    #game-text {
      flex: 1;
      min-width: 0;
    }
    #q-number {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    #q-passage {
      font-size: 18px;
      color: rgb(80,50,30);
      margin-bottom: 8px;
      max-height: 120px;
      overflow-y: auto;
    }
    #q-text {
      font-size: 22px;
      color: rgb(30,15,5);
      margin-bottom: 6px;
      max-height: 220px;
      overflow-y: auto;
    }

    /* Choice buttons – two columns at bottom */
    #choices-left, #choices-right {
      position: absolute;
      bottom: 80px;
      width: 540px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 60px;
    }
    #choices-left  { left: 90px; bottom: 60px; }
    #choices-right { right: 90px; bottom: 60px}

    .choice-btn {
      width: 100%;
      min-height: 70px;
      padding: 14px 18px;
      background: rgba(255,255,255,0.22);
      border: 2px solid rgb(80,40,20);
      border-radius: 10px;
      cursor: pointer;
      font: 22px 'Comic Sans MS', cursive;
      color: rgb(40,20,5);
      text-align: left;
    }
    .choice-btn:hover {
      background: rgba(255,255,255,0.50);
    }

    #done-banner {
      display: none;
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.80);
      border: 3px solid #ffd54f;
      border-radius: 16px;
      padding: 40px 60px;
      min-width: 400px;
      max-width: 80%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #done-score {
      font-size: 38px;
      font-weight: bold;
      color: #ffd54f;
      margin-bottom: 16px;
    }
    #done-banner .sub {
      font-size: 22px;
      color: #fff;
      opacity: 0.85;
    }
    .done-dots {
      display: inline-block;
      animation: dotPulse 1.4s infinite steps(4, end);
    }
    @keyframes dotPulse {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
    }
    .done-dots::after {
      content: '';
      animation: dotCycle 1.4s infinite steps(1, end);
    }
    @keyframes dotCycle {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
    }

    /* ── End Screen ───────────────────────────────────── */
    #end-screen {
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 0 30px;
      overflow-y: auto;
      gap: 10px;
    }
    #end-text {
      font-size: 42px;
      color: #fff;
      text-align: center;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
      z-index: 2;
      padding: 20px 40px;
      border-radius: 12px;
      background: rgba(0,0,0,0.5);
    }
    #play-again-btn {
      margin-top: 10px;
      margin-bottom: 20px;
      padding: 16px 48px;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      background: rgba(0,0,0,0.6);
      border: 3px solid #fff;
      border-radius: 10px;
      cursor: pointer;
      z-index: 2;
      transition: background 0.2s;
    }
    #play-again-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    #review-title {
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      text-align: center;
      z-index: 2;
    }
    #review-section {
      z-index: 2;
      width: 85%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
      padding-bottom: 20px;
    }
    .review-card {
      background: rgba(0,0,0,0.65);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      border: 2px solid;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .review-card.correct {
      border-color: #4caf50;
    }
    .review-card.wrong {
      border-color: #f44336;
    }
    .review-q {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .review-answer {
      font-size: 13px;
      margin-top: 3px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .review-answer.your-correct {
      color: #a5d6a7;
    }
    .review-answer.your-wrong {
      color: #ef9a9a;
    }
    .review-answer.correct-ans {
      color: #a5d6a7;
    }

    /* ── AI Coach Feedback ─────────────────────────────── */
    #ai-feedback-section {
      z-index: 2;
      width: 85%;
      max-width: 1000px;
      background: rgba(0,0,0,0.65);
      border: 2px solid #ffd54f;
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 10px;
    }
    #ai-feedback-title {
      font-size: 22px;
      font-weight: bold;
      color: #ffd54f;
      margin-bottom: 10px;
      text-align: center;
    }
    #ai-feedback-text {
      font-size: 16px;
      color: #fff;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    #ai-feedback-loading {
      text-align: center;
      color: #ffd54f;
      font-size: 16px;
    }
    .ai-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,213,79,0.3);
      border-top-color: #ffd54f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- ═══ HOME ═══ -->
  <div id="home-screen" class="screen active">
    <img class="bg" src="images/homePage.png" alt="">
    <button id="signin-btn">SIGN IN</button>
    <div id="auth-code-banner"></div>
  </div>

  <!-- ═══ SUBJECT SELECT ═══ -->
  <div id="main-screen" class="screen">
    <img class="bg" src="images/mainScreen.png" alt="">
    <button id="btn-sat" class="subject-btn">SAT</button>
    <button id="btn-lsat" class="subject-btn">LSAT</button>
    <button id="btn-mcat" class="subject-btn">MCAT</button>
  </div>

  <!-- ═══ CHARACTER SELECT ═══ -->
  <div id="char-screen" class="screen">
    <img class="bg" src="images/charSelection.png" alt="">
    <div id="char-grid"></div>
  </div>

  <!-- ═══ WAITING ═══ -->
  <div id="waiting-screen" class="screen">
    <img class="bg" src="images/loadingscreen.png" alt="">
    <div id="wait-status"></div>
  </div>

  <!-- ═══ GAME ═══ -->
  <div id="game-screen" class="screen">
    <img class="bg" src="images/gamescreen.png" alt="">

    <!-- Progress Bar -->
    <div id="progress-bar">
      <div id="char-left" class="progress-char"><img src="" alt=""></div>
      <div id="progress-track">
        <div id="progress-fill-left"></div>
        <div id="progress-fill-right"></div>
        <div id="star-center"><img src="images/sheriffStar2.png" alt="⭐"></div>
      </div>
      <div id="name-left" class="progress-name"></div>
      <div id="name-right" class="progress-name"></div>
      <div id="char-right" class="progress-char"><img src="" alt=""></div>
    </div>

    <!-- Top: image left + question text right -->
    <div id="game-top">
      <div id="game-img"></div>
      <div id="game-text">
        <div id="q-number"></div>
        <div id="q-passage"></div>
        <div id="q-text"></div>
      </div>
    </div>

    <!-- Bottom-left: choices A & B -->
    <div id="choices-left"></div>

    <!-- Bottom-right: choices C & D -->
    <div id="choices-right"></div>

    <!-- Done overlay -->
    <div id="done-banner">
      <div id="done-score"></div>
      <div class="sub">⏳ Waiting for opponent to finish<span class="done-dots"></span></div>
    </div>
  </div>

  <!-- ═══ END ═══ -->
  <div id="end-screen" class="screen">
    <img id="end-bg" class="bg" src="" alt="">
    <div id="end-text"></div>
    <div id="ai-feedback-section" style="display:none;">
      <div id="ai-feedback-title">🤖 AI Coach Feedback</div>
      <div id="ai-feedback-loading"><span class="ai-spinner"></span> Analyzing your performance...</div>
      <div id="ai-feedback-text"></div>
    </div>
    <div id="review-title">📋 Review</div>
    <div id="review-section"></div>
    <button id="play-again-btn">PLAY AGAIN</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   All game logic – protocols, auth, websocket client, UI
   ═══════════════════════════════════════════════════════════ */

// ── Protocols ───────────────────────────────────────────
const Protocols = {
  Response: {
    NICKNAME:             "protocols.response.nickname",
    QUESTIONS:            "protocols.questions",
    QUESTION_DETAIL:      "protocols.question.detail",
    START:                "protocols.start",
    OPPONENT:             "protocols.opponent",
    OPPONENT_ADVANCE:     "protocols.opponent.advance",
    ANSWER_VALID:         "protocols.answer.valid",
    ANSWER_INVALID:       "protocols.answer.invalid",
    WINNER:               "protocols.winner",
    TIE:                  "protocols.tie",
    GAME_OVER:            "protocols.game.over",
    OPPONENT_DISCONNECTED:"protocols.opponent.disconnected",
    AI_FEEDBACK:          "protocols.ai.feedback",
  },
  Request: {
    ANSWER:   "protocols.answer",
    NICKNAME: "protocols.nickname",
    TABLE:    "protocols.table",
    LEAVE:    "protocols.leave",
    SPECIES:  "protocols.species",
    FEEDBACK: "protocols.feedback",
  },
};

// ── Config ──────────────────────────────────────────────
const AUTH0_DOMAIN    = "dev-rme822qrk8tmjtko.us.auth0.com";
const AUTH0_CLIENT_ID = "iHrUT1YqwO0o86sRUc7u9sNGyPBssFnq";
const AUTH0_AUDIENCE  = "https://dev-rme822qrk8tmjtko.us.auth0.com/api/v2/";
const SERVER_HOST     = "localhost";
const SERVER_PORT     = 64210;

// ── Auth Manager ────────────────────────────────────────
const auth = {
  deviceCode: null,
  userCode: null,
  verificationUri: null,
  accessToken: null,

  async startLogin() {
    console.log("[AUTH] Starting login...");
    try {
      const resp = await fetch(`https://${AUTH0_DOMAIN}/oauth/device/code`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          client_id: AUTH0_CLIENT_ID,
          scope: "openid profile email",
          audience: AUTH0_AUDIENCE,
        }),
      });
      const data = await resp.json();
      console.log("[AUTH] Device code response:", data);
      this.deviceCode = data.device_code;
      this.userCode = data.user_code;
      this.verificationUri = data.verification_uri_complete;
      if (this.verificationUri) window.open(this.verificationUri, "_blank");
      return this.userCode;
    } catch (e) {
      console.error("[AUTH] startLogin failed:", e);
      return null;
    }
  },

  async checkToken() {
    const resp = await fetch(`https://${AUTH0_DOMAIN}/oauth/token`, {
      method: "POST",
      body: new URLSearchParams({
        grant_type: "urn:ietf:params:oauth:grant-type:device_code",
        device_code: this.deviceCode || "",
        client_id: AUTH0_CLIENT_ID,
      }),
    });
    const data = await resp.json();
    if (resp.status === 200) {
      this.accessToken = data.access_token;
      return true;
    }
    return false;
  },

  async fetchUserinfo() {
    if (!this.accessToken) return null;
    try {
      const resp = await fetch(`https://${AUTH0_DOMAIN}/userinfo`, {
        headers: { Authorization: `Bearer ${this.accessToken}` },
      });
      if (resp.ok) return await resp.json();
    } catch (e) { console.log("fetchUserinfo failed", e); }
    return null;
  },
};

// ── WebSocket Client ────────────────────────────────────
const client = {
  ws: null,
  nickname: null,
  closed: false,
  started: false,
  questions: [],
  currentQuestionIndex: 0,
  opponentQuestionIndex: 0,
  opponentCorrectCount: 0,
  opponentName: null,
  opponentSpecies: null,
  winner: null,
  youWon: false,
  tie: false,
  gameOver: false,
  correctCount: 0,
  currentQuestionText: null,
  currentChoices: null,
  currentImageData: null,
  currentPassage: null,
  currentAnswer: null,
  reviewHistory: [],

  start() {
    return new Promise((resolve, reject) => {
      const url = `ws://${SERVER_HOST}:${SERVER_PORT}`;
      try { this.ws = new WebSocket(url); } catch (e) { return reject(e); }

      this.ws.onopen = () => { console.log("[WS] Connected"); resolve(); };
      this.ws.onerror = (e) => { console.log("[WS] Error", e); reject(new Error("WS failed")); };
      this.ws.onclose = () => { console.log("[WS] Closed"); this.closed = true; };

      this.ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        this._handle(msg);
      };
    });
  },

  send(type, data) {
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
    this.ws.send(JSON.stringify({ type, data }));
  },

  close() {
    this.closed = true;
    try { this.ws && this.ws.close(); } catch {}
  },

  _handle(msg) {
    const { type, data } = msg;
    console.log("[CLIENT]", type);

    switch (type) {
      case Protocols.Response.QUESTIONS:
        this.questions = data;
        break;

      case Protocols.Response.QUESTION_DETAIL:
        if (!data) break;
        this.currentQuestionText = data.question;
        this.currentChoices      = data.choices;
        this.currentPassage      = data.passage;
        this.currentAnswer       = data.answer;
        this.currentImageData    = data.image_data || null;
        ui.renderGame();
        break;

      case Protocols.Response.OPPONENT:
        if (typeof data === 'object' && data !== null) {
          this.opponentName = data.name;
          this.opponentSpecies = data.species;
        } else {
          this.opponentName = data;
        }
        ui.refreshWaiting();
        break;

      case Protocols.Response.OPPONENT_ADVANCE:
        this.opponentQuestionIndex++;
        if (data === true) this.opponentCorrectCount++;
        ui.updateProgressBar();
        break;

      case Protocols.Response.ANSWER_VALID:
        if (data) {
          client.reviewHistory.push({ ...data, correct: true });
        }
        this.currentQuestionIndex++;
        this.correctCount++;
        ui.updateProgressBar();
        ui.renderGame();
        break;

      case Protocols.Response.ANSWER_INVALID:
        if (data) {
          client.reviewHistory.push({ ...data, correct: false });
        }
        this.currentQuestionIndex++;
        ui.renderGame();
        break;

      case Protocols.Response.GAME_OVER:
        this.gameOver = true;
        ui.renderGame();
        break;

      case Protocols.Response.START:
        this.started = true;
        this.currentQuestionIndex = 0;
        this.opponentQuestionIndex = 0;
        this.opponentCorrectCount = 0;
        this.correctCount = 0;
        this.reviewHistory = [];
        this.winner = null;
        this.youWon = false;
        this.tie = false;
        this.gameOver = false;
        ui.showScreen("game-screen");
        ui.initProgressBar();
        ui.renderGame();
        break;

      case Protocols.Response.TIE:
        this.tie = true;
        ui.showEnd();
        break;

      case Protocols.Response.WINNER:
        if (data === null) this.youWon = true;
        else this.winner = data;
        ui.showEnd();
        break;

      case Protocols.Response.AI_FEEDBACK:
        ui.showAiFeedback(data);
        break;

      case Protocols.Response.OPPONENT_DISCONNECTED:
        if (!this.gameOver && !this.tie && !this.youWon && !this.winner) {
          this.close();
        }
        ui.showEnd();
        break;
    }
  },
};

// ── UI Controller ───────────────────────────────────────
const ui = {
  showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  },

  /* ── Home / Auth ─────────────────────── */
  initHome() {
    document.getElementById("signin-btn").onclick = async () => {
      const btn = document.getElementById("signin-btn");
      btn.disabled = true;
      btn.textContent = "Connecting...";

      const userCode = await auth.startLogin();
      if (!userCode) {
        btn.disabled = false;
        btn.textContent = "SIGN IN";
        alert("Could not reach Auth0. Check your connection.");
        return;
      }

      const banner = document.getElementById("auth-code-banner");
      banner.style.display = "block";
      banner.innerHTML = `
        <div style="font-size:20px;color:#fff;margin-bottom:12px;">Open this URL in your browser:</div>
        <div style="font-size:22px;font-weight:bold;color:#ffd54f;margin-bottom:16px;">
          ${auth.verificationUri ? `<a href="${auth.verificationUri}" target="_blank" style="color:#ffd54f;">${auth.verificationUri}</a>` : 'https://dev-rme822qrk8tmjtko.us.auth0.com/activate'}
        </div>
        <div style="font-size:20px;color:#fff;margin-bottom:8px;">Or enter this code:</div>
        <div style="font-size:40px;font-weight:bold;color:#ffd54f;letter-spacing:6px;">${userCode}</div>
        <div style="font-size:16px;color:#aaa;margin-top:14px;">Waiting for login confirmation...</div>
        <div style="margin-top:20px;">
          <button id="guest-skip-btn" style="background:transparent;border:1px solid #aaa;color:#aaa;padding:8px 24px;border-radius:8px;font-size:15px;cursor:pointer;">
            Skip — Play as Guest
          </button>
        </div>
      `;
      document.getElementById("guest-skip-btn").onclick = () => {
        clearInterval(this._authInterval);
        document.getElementById("auth-code-banner").style.display = "none";
        document.getElementById("signin-btn").style.display = "block";
        document.getElementById("signin-btn").disabled = false;
        document.getElementById("signin-btn").textContent = "SIGN IN";
        this._connectAsGuest();
      };
      btn.style.display = "none";
      this._pollAuth();
    };
  },

  async _connectAsGuest() {
    document.getElementById("auth-code-banner").style.display = "none";
    try { await client.start(); } catch (e) {
      console.error("Server connection failed", e);
      alert("Could not connect to game server on port 64210. Is it running?");
      return;
    }
    const nick = prompt("Enter your nickname:", "Player") || "Player";
    client.send(Protocols.Request.NICKNAME, nick);
    client.nickname = nick;
    ui.showScreen("main-screen");
  },

  _authInterval: null,
  _pollAuth() {
    this._authInterval = setInterval(async () => {
      const ok = await auth.checkToken();
      if (!ok) return;
      clearInterval(this._authInterval);

      document.getElementById("auth-code-banner").style.display = "none";
      document.getElementById("signin-btn").style.display = "block";
      document.getElementById("signin-btn").disabled = false;
      document.getElementById("signin-btn").textContent = "SIGN IN";

      try { await client.start(); } catch (e) {
        console.error("Server connection failed", e);
        alert("Could not connect to game server on port 64210. Is it running?");
        return;
      }

      const profile = await auth.fetchUserinfo();
      let nick = "Player";
      if (profile) nick = profile.nickname || profile.name || profile.preferred_username || "Player";
      client.send(Protocols.Request.NICKNAME, nick);
      client.nickname = nick;

      ui.showScreen("main-screen");
    }, 5000);
  },

  /* ── Subject Selection ───────────────── */
  initSubjects() {
    const subjects = {
      "btn-sat":  "QUESTION_ANSWERS_SATREADING",
      "btn-lsat": "QUESTION_ANSWERS_LSAT",
      "btn-mcat": "QUESTION_ANSWERS_MCAT",
    };
    for (const [btnId, table] of Object.entries(subjects)) {
      document.getElementById(btnId).onclick = () => {
        client.send(Protocols.Request.TABLE, table);
        ui.showScreen("char-screen");
      };
    }
  },

  /* ── Character Selection ─────────────── */
  initCharacters() {
    const characterMap = [
    { name: "Barbara", species: "redPanda" },
    { name: "Dennis", species: "dino" },
    { name: "Cassandra", species: "capy" },
    { name: "Charlie", species: "chick" },
    { name: "Pancho", species: "penguin" },
    { name: "Alex", species: "bunny" },
    { name: "Cloudy", species: "cat" },
    { name: "Eduardo", species: "elephant" },
  ];

  const grid = document.getElementById("char-grid");
  
  characterMap.forEach(char => {
    const cell = document.createElement("div");
    cell.className = "char-cell";
    
    // Path uses the 'species' (folder name)
    const img = document.createElement("img");
    img.src = `images/animals/${char.species}/${char.species}_forward.png`;
    
    // Label uses the 'name'
    const label = document.createElement("span");
    label.textContent = char.name;

    cell.appendChild(img);
    cell.appendChild(label);
    
    cell.onclick = () => {
      // Store both
      client.selectedName = char.name;
      client.selectedSpecies = char.species;
      client.send(Protocols.Request.SPECIES, char.species);
      
      ui.showScreen("waiting-screen");
      ui.refreshWaiting();
    };
    grid.appendChild(cell);
  });
},

  /* ── Waiting ─────────────────────────── */
  refreshWaiting() {
    const el = document.getElementById("wait-status");
    if (!el) return;
    el.innerHTML = [
      `Logged in: true`,
      `Questions loaded: ${client.questions.length > 0}`,
      `Opponent: ${client.opponentName || "searching..."}`,
    ].join("<br>");
  },

  /* ── Game Screen ─────────────────────── */
  renderGame() {
    const totalQs = client.questions.length || 5;
    const qNum = Math.min(client.currentQuestionIndex + 1, totalQs);

    document.getElementById("q-number").textContent =
      `Question ${qNum} of ${totalQs}`;

    document.getElementById("q-passage").textContent =
      client.currentPassage || "";

    document.getElementById("q-text").textContent =
      client.currentQuestionText || "";

    const leftCol   = document.getElementById("choices-left");
    const rightCol  = document.getElementById("choices-right");
    const doneBanner = document.getElementById("done-banner");

    const playerDone = client.gameOver || client.currentQuestionIndex >= totalQs;
    if (playerDone) {
      leftCol.style.display = "none";
      rightCol.style.display = "none";
      doneBanner.style.display = "block";
      document.getElementById("done-score").textContent =
        `All done! Score: ${client.correctCount}/${totalQs}`;
    } else {
      doneBanner.style.display = "none";
      leftCol.style.display = "flex";
      rightCol.style.display = "flex";
      leftCol.innerHTML = "";
      rightCol.innerHTML = "";

      const choices = client.currentChoices || {};
      ["A","B"].forEach(letter => {
        const text = choices[letter];
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = text ? `${letter}:  ${text}` : `${letter}:  ---`;
        btn.onclick = () => {
          if (client.gameOver) return;
          client.send(Protocols.Request.ANSWER, letter);
        };
        leftCol.appendChild(btn);
      });
      ["C","D"].forEach(letter => {
        const text = choices[letter];
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = text ? `${letter}:  ${text}` : `${letter}:  ---`;
        btn.onclick = () => {
          if (client.gameOver) return;
          client.send(Protocols.Request.ANSWER, letter);
        };
        rightCol.appendChild(btn);
      });
    }

    const imgPanel = document.getElementById("game-img");
    imgPanel.innerHTML = "";
    if (client.currentImageData) {
      const img = document.createElement("img");
      img.src = `data:image/png;base64,${client.currentImageData}`;
      imgPanel.appendChild(img);
    }
  },

  /* ── Progress Bar ─────────────────────── */
  WIN_TARGET: 3,

  initProgressBar() {
    const sp = client.selectedSpecies || "bunny";
    const op = client.opponentSpecies || "bunny";
    document.querySelector("#char-left img").src = `images/animals/${sp}/${sp}_idle.png`;
    document.querySelector("#char-right img").src = `images/animals/${op}/${op}_idle_reversed.png`;
    document.getElementById("name-left").textContent = client.nickname || "You";
    document.getElementById("name-right").textContent = client.opponentName || "Opponent";
    document.getElementById("progress-fill-left").style.width = "0%";
    document.getElementById("progress-fill-right").style.width = "0%";
    const charLeft = document.getElementById("char-left");
    charLeft.style.left = "-40px";
    charLeft.style.right = "auto";
    const charRight = document.getElementById("char-right");
    charRight.style.right = "-40px";
    charRight.style.left = "auto";
    const star = document.getElementById("star-center");
    star.style.left = "calc(50% - 24px)";
    star.style.opacity = "1";
    star.style.top = "-15px";
    star.classList.remove("star-throw-left", "star-throw-right");
  },

  updateProgressBar() {
    const wt = this.WIN_TARGET;
    const myPct = Math.min(client.correctCount / wt, 1);
    const opPct = Math.min(client.opponentCorrectCount / wt, 1);

    document.getElementById("progress-fill-left").style.width = `${myPct * 50}%`;
    document.getElementById("progress-fill-right").style.width = `${opPct * 50}%`;

    // Move characters toward center using calc() so it scales with any track width
    // At 0%: calc(0% - 40px) = -40px (off edge). At 100%: calc(50% - 40px) = centered.
    const charLeft = document.getElementById("char-left");
    charLeft.style.left = `calc(${myPct * 50}% - 40px)`;

    const charRight = document.getElementById("char-right");
    charRight.style.right = `calc(${opPct * 50}% - 40px)`;
    charRight.style.left = "auto";
  },

  setProgressEndState() {
    const sp = client.selectedSpecies || "bunny";
    const op = client.opponentSpecies || "bunny";
    const star = document.getElementById("star-center");
    star.classList.remove("star-throw-left", "star-throw-right");

    if (client.tie) {
      // Both sad — star stays in center, no throw
      document.querySelector("#char-left img").src = `images/animals/${sp}/${sp}_sad.png`;
      document.querySelector("#char-right img").src = `images/animals/${op}/${op}_sad.png`;
    } else if (client.youWon) {
      // You won: happy + throw star at opponent (right)
      document.querySelector("#char-left img").src = `images/animals/${sp}/${sp}_happy.png`;
      document.querySelector("#char-right img").src = `images/animals/${op}/${op}_sad.png`;
      // Small delay so the user sees the final bar state first
      setTimeout(() => { star.classList.add("star-throw-right"); }, 400);
    } else {
      // You lost: sad, opponent happy + star flies at you (left)
      document.querySelector("#char-left img").src = `images/animals/${sp}/${sp}_sad.png`;
      document.querySelector("#char-right img").src = `images/animals/${op}/${op}_happy.png`;
      setTimeout(() => { star.classList.add("star-throw-left"); }, 400);
    }
  },

  showAiFeedback(text) {
    const section = document.getElementById("ai-feedback-section");
    const loading = document.getElementById("ai-feedback-loading");
    const textEl = document.getElementById("ai-feedback-text");
    loading.style.display = "none";
    textEl.textContent = text;
    section.style.display = "block";
  },

  /* ── End Screen ──────────────────────── */
  showEnd() {
    let text;
    let bgImage;
    if (client.tie) {
      text = `It's a tie! You both scored ${client.correctCount}/3`;
      bgImage = "images/winScreen.png";
    } else if (client.youWon) {
      text = `You won! Score: ${client.correctCount}/3`;
      bgImage = "images/winScreen.png";
    } else if (client.winner) {
      text = `${client.winner} won! Your score: ${client.correctCount}/3`;
      bgImage = "images/lostScreen.png";
    } else {
      text = "Opponent left the game.....";
      bgImage = "images/lostScreen.png";
    }
    document.getElementById("end-bg").src = bgImage;
    document.getElementById("end-text").textContent = text;

    // Move progress bar to end screen and show final poses
    const progressBar = document.getElementById("progress-bar");
    const endScreen = document.getElementById("end-screen");
    if (progressBar) {
      endScreen.insertBefore(progressBar, endScreen.children[1]);
      this.updateProgressBar();
      this.setProgressEndState();
    }

    // Helper: display an answer as "Letter) text"
    const answerDisplay = (answer, choices) => {
      if (!choices) return answer;
      const upper = String(answer).trim().toUpperCase();
      // If answer is already a choice letter
      if (["A","B","C","D"].includes(upper)) {
        const choiceText = choices[upper];
        return choiceText ? `${upper}) ${choiceText}` : upper;
      }
      // Answer is a raw value — find which choice matches
      for (const [letter, val] of Object.entries(choices)) {
        if (val && String(val).trim().toUpperCase() === upper) {
          return `${letter}) ${val}`;
        }
      }
      return answer;
    };

    // Build review cards
    const reviewEl = document.getElementById("review-section");
    reviewEl.innerHTML = "";
    client.reviewHistory.forEach((item, i) => {
      const card = document.createElement("div");
      card.className = `review-card ${item.correct ? "correct" : "wrong"}`;

      const qDiv = document.createElement("div");
      qDiv.className = "review-q";
      qDiv.textContent = `Q${i + 1}: ${item.question || "(No question text)"}`;
      card.appendChild(qDiv);

      const yourDiv = document.createElement("div");
      yourDiv.className = `review-answer ${item.correct ? "your-correct" : "your-wrong"}`;
      yourDiv.textContent = `Your answer: ${answerDisplay(item.yourAnswer, item.choices)} ${item.correct ? "✅" : "❌"}`;
      card.appendChild(yourDiv);

      if (!item.correct) {
        const correctDiv = document.createElement("div");
        correctDiv.className = "review-answer correct-ans";
        correctDiv.textContent = `Correct answer: ${answerDisplay(item.correctAnswer, item.choices)}`;
        card.appendChild(correctDiv);
      }

      reviewEl.appendChild(card);
    });

    // Request AI feedback from Gemini
    const feedbackSection = document.getElementById("ai-feedback-section");
    const feedbackLoading = document.getElementById("ai-feedback-loading");
    const feedbackText = document.getElementById("ai-feedback-text");
    feedbackSection.style.display = "block";
    feedbackLoading.style.display = "block";
    feedbackText.textContent = "";
    if (client.reviewHistory.length > 0) {
      client.send(Protocols.Request.FEEDBACK, client.reviewHistory.map(item => ({
        question: item.question || item.currentQuestionText || "",
        yourAnswer: item.yourAnswer || "",
        correctAnswer: item.correctAnswer || "",
        correct: !!item.correct,
      })));
    }

    document.getElementById("play-again-btn").onclick = async () => {
      // Notify server we're leaving the current game
      client.send(Protocols.Request.LEAVE, null);

      // Move progress bar back to game screen
      const progressBar = document.getElementById("progress-bar");
      const gameScreen = document.getElementById("game-screen");
      if (progressBar && gameScreen) {
        gameScreen.insertBefore(progressBar, gameScreen.children[1]);
      }

      // Reset all game state
      client.started = false;
      client.gameOver = false;
      client.currentQuestionIndex = 0;
      client.opponentQuestionIndex = 0;
      client.opponentCorrectCount = 0;
      client.correctCount = 0;
      client.reviewHistory = [];
      client.winner = null;
      client.youWon = false;
      client.tie = false;
      client.opponentName = null;
      client.opponentSpecies = null;

      // Reconnect WebSocket if it was closed
      if (client.closed || !client.ws || client.ws.readyState !== WebSocket.OPEN) {
        client.closed = false;
        try {
          await client.start();
          client.send(Protocols.Request.NICKNAME, client.nickname || "Player");
        } catch (e) {
          console.error("Reconnect failed", e);
          alert("Could not reconnect to server. Please refresh the page.");
          return;
        }
      }

      ui.showScreen("main-screen");
    };
    this.showScreen("end-screen");
  },
};

// ── Boot ────────────────────────────────────────────────
ui.initHome();
ui.initSubjects();
ui.initCharacters();
</script>
